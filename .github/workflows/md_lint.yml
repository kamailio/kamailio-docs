---
name: md_lint
on:
  push:
    branches:
      - master
    paths:
      - '**.md'
  pull_request:
    branches:
      - master
    paths:
      - '**.md'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  depth-value:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate depth from Pull-Request commits
        id: set_value
        run: |
          if [[ "${{ github.event_name }}" == 'pull_request' ]] ; then
            val=$(( ${{ github.event.pull_request.commits || 0 }} + 1 ))
          else
            val=2
          fi
          echo "val is $val"
          echo "result=$val" >> "$GITHUB_OUTPUT"
    outputs:
      pr_depth: ${{ steps.set_value.outputs.result }}
  lint:
    runs-on: ubuntu-latest
    needs: depth-value
    permissions:
      contents: read # to fetch code (actions/checkout)
    strategy:
      matrix:
        directory:
          - kamailio-5.8-install-guide-git
          - kamailio-6.0-install-guide-git
          - kamailio-6.1-install-guide-git
          - kamailio-install-guide-deb
          - kamailio-install-guide-git
          - kamailio-kemi-framework
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            ${{ matrix.directory }}
            .pymarkdown
          fetch-depth: ${{ needs.depth-value.outputs.pr_depth }}

      - name: Get all changed markdown files
        id: changed-markdown-files
        uses: tj-actions/changed-files@v47
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          files: |
            ${{ matrix.directory }}/docs/**/*.md
          since_last_remote_commit: true
          write_output_files: true
          output_dir: ".github/outputs"

      - name: Install pymarkdown
        if: steps.changed-markdown-files.outputs.all_changed_files != ''
        run: pip install pymarkdownlnt

      - name: Run pymarkdown
        if: steps.changed-markdown-files.outputs.all_changed_files != ''
        run: |
          pymarkdown --config .pymarkdown scan ${{ steps.changed-markdown-files.outputs.all_changed_files }}
